version: "3.0"

daemon:
  host: "127.0.0.1"
  port: 9599
  inactivity_timeout: 300   # 5 min — consider task done after no user activity

notification:
  enabled: true
  channels:
    - type: feishu
      target: chat:oc_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      webhook: https://open.feishu.cn/open-apis/bot/v2/hook/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
    # OpenClaw 备用渠道 (通过 SKILL.md cron 调用)
    - type: openclaw
      enabled: false
    # 企业微信机器人 — 在群聊里添加机器人，复制 webhook URL
    - type: wecom_bot
      webhook: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=你的key
    # Server酱 — 注册 https://sct.ftqq.com/ 获取 SendKey，推送到个人微信
    # - type: serverchan
    #   sendkey: SCTxxxxxxxxxxxxxxxxxxxxxxxxxxxx

permissions:
  notify_on_prompt: true
  cooldown_seconds: 60

projects:
  - name: "project-companion"
    path: "C:\\Users\\liliy\\.openclaw\\workspace\\project-companion"
    enabled: true
